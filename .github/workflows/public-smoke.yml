name: ALEK Artisan — public smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

      - name: Unit and regression tests
        run: npm test
      - name: Verify this production build locally (no live services)
        env:
          ALEK_BASE_URL: http://127.0.0.1:3000
        run: |
          npm start > /tmp/alek-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$ALEK_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          node --test tests/public-smoke.test.mjs

  database-isolated:
    name: Isolated PostgreSQL migration and concurrency tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install local PostgreSQL server and client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          pg_config --version
          pg_config --bindir
      - name: Test invoice protection, idempotency and concurrency on disposable database
        run: bash tests/database/invoices/run.sh
      - name: Test user isolation and Stripe/PayPal coordination on disposable database
        run: sh tests/database/security-isolation.sh
